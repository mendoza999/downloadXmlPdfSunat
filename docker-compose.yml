services:
  sunat-bot:
    build: .
    image: sunat-downloadpdf:latest
    container_name: sunat-downloadpdf
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/Lima}
      # Prefijo publico con el que Nginx publica la app
      ROOT_PATH: ${ROOT_PATH:-/downloadpdf}
      # SQLite persistente dentro del volumen ./data
      # Si usa PostgreSQL, reemplace esta linea por su cadena de conexion.
      DATABASE_URL: sqlite:////app/data/sunat.db
    ports:
      # Solo escucha en localhost; Nginx es el unico expuesto a Internet
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    volumes:
      - ./descargas_sunat:/app/descargas_sunat
      - ./uploads:/app/uploads
      - ./data:/app/data
    # Playwright/Chromium necesita memoria compartida suficiente
    shm_size: "1gb"
