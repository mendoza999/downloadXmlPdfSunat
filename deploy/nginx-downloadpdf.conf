# ─────────────────────────────────────────────────────────────────────────────
# Nginx: publica la API en https://servicios.algoritmojuridico.com/downloadpdf/
#
# La app se ejecuta con docker-compose en 127.0.0.1:8010 y con
# ROOT_PATH=/downloadpdf.
#
# Copiar el bloque "location" dentro del server {} del dominio que ya tiene
# el certificado SSL (o incluirlo desde un archivo en conf.d).
# ─────────────────────────────────────────────────────────────────────────────

# Redirige la ruta sin barra final para que los recursos relativos funcionen
location = /downloadpdf {
    return 301 /downloadpdf/;
}

location /downloadpdf/ {
    # La barra final en proxy_pass elimina el prefijo /downloadpdf/ antes de
    # enviar la peticion a FastAPI, que trabaja con rutas internas (/docs, ...).
    proxy_pass http://127.0.0.1:8010/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 25m;

    # La descarga puntual incluye login con Playwright y reintentos:
    # conviene un timeout amplio para no cortar la peticion.
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}
